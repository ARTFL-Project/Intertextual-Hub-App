# intertextual-hub — the container's own Apache.
#
# It does three jobs and all three are load-bearing:
#   1. serves the built Vue bundle at /
#   2. runs PhiloLogic 4.6 as CGI under /philologic/  (over half of all traffic)
#   3. reverse-proxies the two gunicorn apps
#
# PLAIN HTTP THROUGHOUT. TLS is terminated once, by the host's Apache, which proxies to
# 127.0.0.1:8448 -> this listener. The previous arrangement terminated it three times —
# host Apache, then this vhost on :1443, then each gunicorn holding --keyfile/--certfile —
# and the inner two verified nothing at all (SSLProxyVerify none, SSLProxyCheckPeerCN off,
# SSLProxyCheckPeerName off). Those directives are gone rather than left inert: they were
# the reason /etc/letsencrypt was mounted read-write into this container.
<VirtualHost *:8000>
    ServerName intertextual-hub.uchicago.edu

    DocumentRoot /var/www/html
    DirectoryIndex /intertextual_hub/Intertextual-Hub-App/web-app/dist/index.html

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined

    # The host proxies with ProxyPreserveHost On and RemoteIPHeader X-Forwarded-For, so
    # the client address arrives in the header rather than in the connection.
    RemoteIPHeader X-Forwarded-For

    # --- the two gunicorn apps, on loopback, plain HTTP -----------------------------
    <Location /topologic/>
        ProxyPass        http://127.0.0.1:8443/ Keepalive=On
        ProxyPassReverse http://127.0.0.1:8443/
    </Location>
    <Location /topologic-api>
        ProxyPass        http://127.0.0.1:8443 Keepalive=On
        ProxyPassReverse http://127.0.0.1:8443
    </Location>
    <Location /intertextual-hub-api>
        ProxyPass        http://127.0.0.1:8444 Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444
    </Location>
    <Location /intertextual-hub>
        ProxyPass        http://127.0.0.1:8444 Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444
    </Location>
    <Location /public>
        ProxyPass        http://127.0.0.1:8444/public Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/public
    </Location>
    <Location /search>
        ProxyPass        http://127.0.0.1:8444/search Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/search
    </Location>
    <Location /document>
        ProxyPass        http://127.0.0.1:8444/document Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/document
    </Location>
    <Location /navigate>
        ProxyPass        http://127.0.0.1:8444/navigate Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/navigate
    </Location>
    <Location /word>
        ProxyPass        http://127.0.0.1:8444/word Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/word
    </Location>
    <Location /topic>
        ProxyPass        http://127.0.0.1:8444/topic Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/topic
    </Location>
    <Location /seq-pair>
        ProxyPass        http://127.0.0.1:8444/seq-pair Keepalive=On
        ProxyPassReverse http://127.0.0.1:8444/seq-pair
    </Location>
</VirtualHost>

# PhiloLogic ships a per-database .htaccess that sets `Options +ExecCGI`,
# `AddHandler cgi-script py` and `DirectoryIndex dispatcher.py`, so AllowOverride must stay
# permissive here or every /philologic/ URL 404s. This is how PhiloLogic 4 is deployed; it
# is not an oddity of this container.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
