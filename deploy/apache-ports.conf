# One listener, plain HTTP. The host's Apache terminates TLS and proxies here.
#
# This used to read "Listen 1443", and this container held the host's live Let's Encrypt
# key so it could serve TLS itself — a leftover from when this service was a virtual
# machine rather than a container. The stock 000-default.conf also carried a *:80 vhost
# that never bound, because nothing ever listened on 80; it is gone with the rest.
Listen 8000
